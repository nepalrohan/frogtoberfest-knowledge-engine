name: CI

on:
  # push:
  #   branches:
  #     - main
  # pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo lint
      - run: pnpm turbo check-types
      # - run: pnpm turbo test

  docker:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build API
        run: |
          docker build \
            -f apps/backend/Dockerfile \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/test:api-${{ github.sha }} .

      - name: Build Web
        run: |
          docker build \
            -f apps/web/Dockerfile \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/test:web-${{ github.sha }} .

      - name: Push API
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/test:api-${{ github.sha }}

      - name: Push Web
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/test:web-${{ github.sha }}
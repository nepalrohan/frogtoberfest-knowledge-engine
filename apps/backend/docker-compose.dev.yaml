services:
  jaeger:
    image: jaegertracing/all-in-one:latest # PIN THE VERSION
    ports:
      - '16686:16686'
      - '4317:4317'

  postgres:
    image: pgvector/pgvector:pg16
    container_name: frogtoberfest_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${DATABASE_NAME:-frogtoberfest}
    ports:
      - "5432:5432"
    volumes:
      - frogtoberfest_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres} -d ${DATABASE_NAME:-frogtoberfest}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - frogtoberfest-network

  redis:
    image: redis:7-alpine
    container_name: frogtoberfest_redis_dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - frogtoberfest_redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - frogtoberfest-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: frogtoberfest-pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin123}

    ports:
      - '5050:80'

    depends_on:
      - postgres

    networks:
      - frogtoberfest-network

volumes:
  frogtoberfest_pg_data:
  frogtoberfest_redis_data:
networks:
  frogtoberfest-network:
    driver: bridge


services:
  jaeger:
    image: jaegertracing/all-in-one:latest # PIN THE VERSION
    ports:
      - '16686:16686'
      - '4317:4317'

  postgres:
    image: pgvector/pgvector:pg16
    container_name: frogtoberfest_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - "${DATABASE_PORT}:5432"
    volumes:
      - frogtoberfest_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - frogtoberfest-network

  redis:
    image: redis:7-alpine
    container_name: frogtoberfest_redis_dev
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - frogtoberfest_redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - frogtoberfest-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: frogtoberfest-pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}

    ports:
      - '5050:80'

    depends_on:
      - postgres

    networks:
      - frogtoberfest-network

  # Local LLM + embedding server used by the backend (OLLAMA_URL=http://localhost:11434).
  # On macOS Docker runs Ollama on CPU only; the native Ollama app is much faster for the chat model.
  ollama:
    image: ollama/ollama:0.12.6
    container_name: frogtoberfest_ollama_dev
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      # Keep models resident between requests so embedding and chat do not reload on every call
      OLLAMA_KEEP_ALIVE: ${LLM_KEEP_ALIVE:-30m}
    volumes:
      - frogtoberfest_ollama_models:/root/.ollama
    healthcheck:
      test: [ "CMD", "ollama", "list" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - frogtoberfest-network

  # One-shot job pulling the models the backend expects; already-pulled models are skipped quickly
  ollama-init:
    image: ollama/ollama:0.12.6
    container_name: frogtoberfest_ollama_init_dev
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - >
        ollama pull ${EMBEDDING_MODEL:-nomic-embed-text} &&
        ollama pull ${GENERATION_MODEL:-qwen2.5:7b-instruct}
    volumes:
      - frogtoberfest_ollama_models:/root/.ollama
    networks:
      - frogtoberfest-network

  # Optional cross-encoder reranker for chat retrieval (set RERANKER_URL=http://localhost:8081 to use it).
  # Start with: docker compose -f docker-compose.dev.yaml --profile reranker up -d reranker
  # The small default model suits low-RAM machines; BAAI/bge-reranker-base ranks better but needs ~1 GB more.
  reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    container_name: frogtoberfest_reranker_dev
    profiles: [ "reranker" ]
    restart: unless-stopped
    # A small batch-token cap keeps memory low; 20 chunks of ~200 tokens still fit in one batch
    command: [ "--model-id", "${RERANKER_MODEL:-cross-encoder/ms-marco-MiniLM-L-6-v2}", "--max-batch-tokens", "4096" ]
    ports:
      - "8081:80"
    volumes:
      - frogtoberfest_reranker_models:/data
    networks:
      - frogtoberfest-network

volumes:
  frogtoberfest_pg_data:
  frogtoberfest_redis_data:
  frogtoberfest_reranker_models:
  frogtoberfest_ollama_models:
networks:
  frogtoberfest-network:
    driver: bridge

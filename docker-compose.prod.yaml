services:

  api:
    image: sandesh1128/test:api-${IMAGE_TAG}
    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: ${DATABASE_URL}

    expose:
      - "5000"

  web:
    image: sandesh1128/test:web-${IMAGE_TAG}
    restart: unless-stopped

    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:5000

    expose:
      - "3000"

    depends_on:
      - api